[project]
name = "rl-trading"
version = "0.1.0"
description = "Week-1 data pipeline and simulated trading environment for DRL trading experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=23.0.1",
  "torch>=2.3",
  "yfinance>=0.2",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rl_trading*"]
